name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(sed -n 's/^const CARD_VERSION = "\(.*\)";/\1/p' dist/entity-match-card.js)
          if [ "$TAG" != "$FILE_VERSION" ]; then
            echo "Tag v$TAG matcher ikke CARD_VERSION $FILE_VERSION i dist/entity-match-card.js"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/entity-match-card.js
          generate_release_notes: true
